[package]
name = "zn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Pocket dev workshop for Android, written entirely in Rust with egui"
license = "MIT OR Apache-2.0"

[lib]
name = "zn"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zn-desktop"
path = "src/main.rs"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
log = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
ureq = "3"

# Desktop build (used for fast development and tests).
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
env_logger = "0.11"

# Android build. `accesskit` is intentionally left out: eframe refuses to
# compile it together with `android-native-activity`.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "wgpu",
    "android-native-activity",
] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.21"

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Used by `cargo apk build --lib`.
[package.metadata.android]
package = "dev.zenji.zn"
apk_name = "Zn"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Zn"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Lets the app read model files the user keeps in shared storage (granted on a system
# settings page; see platform.rs).
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# On-device inference is unusably slow without optimizations, and `cargo apk build`
# uses the dev profile, so optimize it. Debug info is dropped to keep the APK small.
[profile.dev]
opt-level = 3
debug = false
